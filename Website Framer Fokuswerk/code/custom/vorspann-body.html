<div id="fw-vorspann" data-vorspann="an" aria-hidden="true"><div class="fw-raster"></div><div class="fw-mitte"><div class="fw-marke"><div class="fw-logo"></div><div class="fw-klammern"><span></span><span></span><span></span><span></span></div></div><div class="fw-stand"><div class="fw-linie"><b></b></div><span class="fw-zahl">FOKUS 0 %</span></div></div></div>
<script id="fokuswerk-vorspann-takt">
/* Zeitsteuerung des Vorspanns: Scrollen gesperrt solange er steht, Signal
   "fokuswerk:vorspann-ende" (darauf warten die Einblendungen im Auftakt).
   Entschieden hat der Schalter im headStart: Bei einem Wechsel innerhalb der Seite kommt der
   Vorspann gar nicht – die Fläche wird sofort entfernt. Die Einblendungen im Auftakt merken das am
   fehlenden Knoten [data-vorspann="an"] und stehen fertig da, der Wechsel selbst läuft über den
   Seitenübergang. */
(function () {
  var el = document.getElementById("fw-vorspann"), h = document.documentElement;
  if (!el) return;
  if (h.classList.contains("fw-ohne-vorspann")) { el.remove(); return; }
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var signal = still ? 0 : 1520, ende = still ? 0 : 2100;
  h.style.overflow = "hidden";
  window.__vorspannEndeZeit = performance.now() + signal;
  setTimeout(function () {
    window.__vorspannEnde = true;
    h.style.overflow = "";
    window.dispatchEvent(new Event("fokuswerk:vorspann-ende"));
  }, signal);
  // Prozentzahl im Gleichlauf mit der Ladelinie (Safari animiert CSS-Zahlen nur sprunghaft)
  var zahl = el.querySelector(".fw-zahl"), t0 = performance.now() + 50, dauer = 1100;
  (function schritt() {
    var x = Math.max(0, Math.min(1, (performance.now() - t0) / dauer)), v = 1 - Math.pow(1 - x, 2.2);
    zahl.textContent = "FOKUS " + Math.round(v * 100) + " %";
    if (x < 1) setTimeout(schritt, 50);
  })();
  setTimeout(function () { el.remove(); }, ende);
})();
</script>
